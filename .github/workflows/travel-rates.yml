name: Update Norges Bank exchange rates
on:
  schedule:
    - cron: '40 16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: travel-rates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-travel-rates.mjs
      - name: Save only the public exchange-rate cache
        run: |
          git add travel-rates.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Norges Bank rates'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deploy refreshed data to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
