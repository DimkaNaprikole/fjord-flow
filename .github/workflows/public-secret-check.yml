name: Public credential format check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  credential-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test the limited scanner
        run: python3 -m unittest discover -s scripts -p 'test_check_public_secrets.py'
      - name: Check tracked public files
        run: python3 scripts/check-public-secrets.py
